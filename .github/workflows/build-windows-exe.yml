name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - house_monitor.py
      - requirements-build.txt
      - .github/workflows/build-windows-exe.yml

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependency
        run: python -m pip install -r requirements-build.txt

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name TianFuYuanRunMonitor house_monitor.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TianFuYuanRunMonitor-windows
          path: dist/TianFuYuanRunMonitor.exe
          if-no-files-found: error
